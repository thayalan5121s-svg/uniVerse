<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniVerse — AI-Powered Smart Campus Complaint Management</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans (Display Headings) & Inter (Readable Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root {
      color-scheme: light;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(13, 148, 136, 0.14), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #app {
      width: min(100%, 1460px);
      min-height: 100vh;
      position: relative;
      padding: 20px;
    }

    .app-loading-screen {
      width: min(100%, 720px);
      margin: 10vh auto 0;
      padding: 32px 28px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px -30px rgba(15, 23, 42, 0.35);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .app-loading-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(59, 130, 246, 0.12) 50%, transparent 100%);
      transform: translateX(-100%);
      animation: shimmer 1.8s ease-in-out infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .loading-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(37, 99, 235, 0.08);
      color: #1d4ed8;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.12);
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .loading-spinner {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 3px solid rgba(148, 163, 184, 0.2);
      border-top-color: #2563eb;
      animation: spin 850ms linear infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app-loading-screen h2 {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: #0f172a;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .app-loading-screen p {
      margin: 0;
      font-size: 0.98rem;
      color: #64748b;
      position: relative;
      z-index: 1;
    }
  </style>

  <!-- External Libraries (CDN) -->
  <!-- jsPDF & jsPDF-AutoTable for hardcopy report download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- Canvas Confetti for micro-interactions -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Main Application Root -->
  <div id="app">
    <!-- Fallback Skeleton while JS initializes -->
    <div class="app-loading-screen" aria-live="polite">
      <div class="loading-badge">Campus Operations</div>
      <div class="loading-spinner" aria-hidden="true"></div>
      <h2>Loading UniVerse...</h2>
      <p>Preparing your smarter campus workflow experience.</p>
    </div>
  </div>

  <!-- Main JavaScript App (ES Module for live editing) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
